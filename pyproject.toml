[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-factory"
version = "0.1.0"
description = "A lightweight automotive testing workflow that turns scenario text into structured test artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "lilinanchun-code" }
]
keywords = [
  "automotive-testing",
  "test-cases",
  "bug-report",
  "workflow",
  "quality"
]

[project.scripts]
ai-test-factory = "ai_test_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
